name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported (skills declare Python 3.10+) and current
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skills/*/requirements.txt

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Python packages
        run: |
          pip install pytest
          for req in skills/*/requirements.txt; do pip install -r "$req"; done
          python -m playwright install --with-deps chromium

      - name: Validate skills
        run: python tools/validate_skills.py

      - name: Index is up to date
        run: python tools/build_index.py --check

      - name: Tests
        run: pytest -q tests

      - name: Package
        if: matrix.python-version == '3.12'
        run: python tools/package_skills.py

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: skills
          path: dist/*.skill
