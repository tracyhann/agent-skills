name: Release

# Push a tag named <skill-name>-v<version> (e.g. manuscript-review-annotator-v1.1.0) to publish
# a GitHub release for that skill, with its CHANGELOG notes and the .skill file attached.

on:
  push:
    tags: ["*-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag and collect release notes
        run: python tools/release_notes.py "$GITHUB_REF_NAME" > notes.md

      - name: Validate skills
        run: python tools/validate_skills.py

      - name: Package
        run: |
          skill="${GITHUB_REF_NAME%-v*}"
          python tools/package_skills.py "$skill"
          echo "SKILL_NAME=$skill" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/$SKILL_NAME.skill" \
            --title "$SKILL_NAME ${GITHUB_REF_NAME##*-v}" \
            --notes-file notes.md
