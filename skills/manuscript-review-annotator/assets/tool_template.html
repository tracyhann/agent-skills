<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#E6EAED; --paper:#FFFFFF; --ink:#18212C; --ink2:#566271; --ink3:#86919D;
  --rule:#D3D9DF; --rule2:#E8ECEF; --chip:#F3F5F7; --accent:#1F78B4; --accent-ink:#FFFFFF;
  --ins:#1B7F3B; --del:#A8322A; --figbg:#FFFFFF;
  --c-blocker:#E31A1C; --t-blocker:rgba(227,26,28,.17);
  --c-numbers:#E06F00; --t-numbers:rgba(255,127,0,.24);
  --c-stats:#1F78B4;   --t-stats:rgba(31,120,180,.17);
  --c-figures:#2B8A27; --t-figures:rgba(51,160,44,.20);
  --c-framing:#6A3D9A; --t-framing:rgba(106,61,154,.16);
  --c-refs:#B15928;    --t-refs:rgba(177,89,40,.17);
  --c-typos:#A88A00;   --t-typos:rgba(255,218,40,.46);
  --c-coauthor:#00796B; --t-coauthor:rgba(0,150,136,.20);
  --c-mine:#C81F77;    --t-mine:rgba(231,41,138,.17);
  --font-doc:"Literata", Georgia, "Times New Roman", serif;
  --font-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --rail:400px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#111519; --paper:#1A2027; --ink:#E3E8ED; --ink2:#A3AEBA; --ink3:#77828E;
    --rule:#2E3742; --rule2:#252D36; --chip:#232A33; --accent:#5AA6DB; --accent-ink:#0D1216;
    --ins:#5CC27A; --del:#F08A80; --figbg:#FFFFFF;
    --c-blocker:#FF5C5C; --t-blocker:rgba(255,80,80,.24);
    --c-numbers:#FF9D3D; --t-numbers:rgba(255,150,50,.26);
    --c-stats:#5AA6DB;   --t-stats:rgba(90,166,219,.24);
    --c-figures:#5FC255; --t-figures:rgba(95,194,85,.22);
    --c-framing:#B28BE0; --t-framing:rgba(178,139,224,.24);
    --c-refs:#D98A5A;    --t-refs:rgba(217,138,90,.24);
    --c-typos:#E8C84A;   --t-typos:rgba(232,200,74,.30);
    --c-coauthor:#4DD0C4;--t-coauthor:rgba(77,208,196,.22);
    --c-mine:#F062AA;    --t-mine:rgba(240,98,170,.24);
  }
}
:root[data-theme="dark"]{
  --desk:#111519; --paper:#1A2027; --ink:#E3E8ED; --ink2:#A3AEBA; --ink3:#77828E;
  --rule:#2E3742; --rule2:#252D36; --chip:#232A33; --accent:#5AA6DB; --accent-ink:#0D1216;
  --ins:#5CC27A; --del:#F08A80; --figbg:#FFFFFF;
  --c-blocker:#FF5C5C; --t-blocker:rgba(255,80,80,.24);
  --c-numbers:#FF9D3D; --t-numbers:rgba(255,150,50,.26);
  --c-stats:#5AA6DB;   --t-stats:rgba(90,166,219,.24);
  --c-figures:#5FC255; --t-figures:rgba(95,194,85,.22);
  --c-framing:#B28BE0; --t-framing:rgba(178,139,224,.24);
  --c-refs:#D98A5A;    --t-refs:rgba(217,138,90,.24);
  --c-typos:#E8C84A;   --t-typos:rgba(232,200,74,.30);
  --c-coauthor:#4DD0C4;--t-coauthor:rgba(77,208,196,.22);
  --c-mine:#F062AA;    --t-mine:rgba(240,98,170,.24);
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; height:100%; background:var(--desk); color:var(--ink); font-family:var(--font-ui); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.cat-blocker{--c:var(--c-blocker);--t:var(--t-blocker)} .cat-numbers{--c:var(--c-numbers);--t:var(--t-numbers)}
.cat-stats{--c:var(--c-stats);--t:var(--t-stats)} .cat-figures{--c:var(--c-figures);--t:var(--t-figures)}
.cat-framing{--c:var(--c-framing);--t:var(--t-framing)} .cat-refs{--c:var(--c-refs);--t:var(--t-refs)}
.cat-typos{--c:var(--c-typos);--t:var(--t-typos)} .cat-coauthor{--c:var(--c-coauthor);--t:var(--t-coauthor)}
.cat-mine{--c:var(--c-mine);--t:var(--t-mine)}

/* ---------- app frame */
.app{height:100%; display:grid; grid-template-rows:auto 1fr; min-height:0}
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 14px; background:var(--paper); border-bottom:1px solid var(--rule); position:relative; z-index:5}
.file{display:flex; flex-direction:column; min-width:0; margin-right:6px}
.file b{font-weight:600; font-size:14px; white-space:nowrap}
.file span{font-size:12px; color:var(--ink2); white-space:nowrap}
.file span.warn{color:var(--c-blocker)}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:8px; overflow:hidden; background:var(--chip)}
.seg button{border:0; background:transparent; padding:6px 11px; font-size:13px; color:var(--ink2); display:inline-flex; align-items:center; gap:6px}
.seg button[aria-pressed="true"]{background:var(--paper); color:var(--ink); box-shadow:inset 0 0 0 1px var(--rule); font-weight:500}
.seg button svg{width:15px; height:15px}
.toggle{display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--ink2); padding:4px 6px; border-radius:8px; border:0; background:none}
.toggle .sw{width:30px; height:18px; border-radius:9px; background:var(--rule); position:relative; transition:background .15s}
.toggle .sw::after{content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--paper); transition:transform .15s}
.toggle[aria-pressed="true"] .sw{background:var(--ins)} .toggle[aria-pressed="true"] .sw::after{transform:translateX(12px)}
.toggle[aria-pressed="true"]{color:var(--ink)}
.spacer{flex:1}
.btn{border:1px solid var(--rule); background:var(--paper); padding:6px 11px; border-radius:8px; font-size:13px; white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.sig{display:inline-flex; align-items:center; gap:6px; max-width:240px; font-size:13px; color:var(--ink2); border:1px dashed var(--rule); background:none; padding:5px 10px; border-radius:8px}
.sig b{color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sig:hover{background:var(--chip)} .sig[hidden], .report .sig, .report .sigpop{display:none!important}
.sigpop{position:absolute; z-index:30; top:calc(100% + 6px); width:300px; max-width:calc(100vw - 24px); display:none; flex-direction:column; gap:8px; padding:12px; background:var(--paper); border:1px solid var(--rule); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sigpop.on{display:flex} .sigpop label{font-size:13px; font-weight:600}
.sigpop input{font:inherit; font-size:14px; padding:6px 8px; border:1px solid var(--rule); border-radius:7px; background:var(--paper); color:var(--ink)}
.sigpop p{margin:0; font-size:12px; line-height:1.4; color:var(--ink2)} .sigpop .row{display:flex; gap:6px; justify-content:flex-end}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--del); border-color:color-mix(in srgb,var(--del) 45%,var(--rule))}
.btn.small{padding:3px 8px; font-size:12px; border-radius:6px}
.notes-toggle{display:none}

.main{display:grid; grid-template-columns:minmax(0,1fr) var(--rail); min-height:0}
.desk{overflow:auto; min-height:0; padding:28px 24px 80px}
.sheet{max-width:780px; margin:0 auto; background:var(--paper); padding:56px 64px 72px; border-radius:3px;
  box-shadow:0 0 0 1px var(--rule2), 0 12px 32px rgba(15,25,35,.07)}
.box-mode .figwrap{cursor:crosshair; touch-action:none}
.box-mode .figwrap::after{content:"Drag to draw a box"; position:absolute; top:8px; right:8px; font:500 11px/1 var(--font-ui);
  background:var(--ink); color:var(--paper); padding:5px 7px; border-radius:5px; opacity:.85; pointer-events:none}

/* ---------- manuscript typography */
.sheet{font-family:var(--font-doc); font-size:16.5px; line-height:1.68; color:var(--ink)}
.sheet p{margin:0 0 1em; hyphens:auto}
.doc-title{font-family:var(--font-doc); font-weight:600; font-size:25px; line-height:1.3; margin:0 0 18px; letter-spacing:-.005em}
.sheet h2{font-family:var(--font-doc); font-size:20px; font-weight:600; margin:2em 0 .6em; line-height:1.3}
.sheet h3{font-family:var(--font-doc); font-size:16.5px; font-style:italic; font-weight:400; margin:1.6em 0 .35em; color:var(--ink)}
.sheet sup,.sheet sub{font-size:.7em; line-height:0}
.sheet .ref{font-size:13.5px; line-height:1.55; margin:0 0 .55em; padding-left:2.2em; text-indent:-2.2em; color:var(--ink2)}
.sheet .link{color:var(--accent); word-break:break-all}
.sheet math{font-size:1.05em}
.sheet math[display="block"]{margin:.6em 0}
.sheet .citation{color:inherit}
figure{margin:2.2em -24px; padding:0}
.figwrap{position:relative; background:var(--figbg); border-radius:2px; box-shadow:0 0 0 1px var(--rule2); user-select:none; -webkit-user-select:none}
.figwrap img{display:block; width:100%; height:auto; border-radius:2px; pointer-events:none}
figcaption{font-family:var(--font-ui); font-size:13px; line-height:1.55; color:var(--ink2); margin:10px 24px 0}
figcaption strong{color:var(--ink)}
.tbl{margin:2em 0; font-family:var(--font-ui); font-size:13px}
.tcap{color:var(--ink2); margin-bottom:8px; line-height:1.5}
.tscroll{overflow-x:auto}
.tbl table{border-collapse:collapse; width:100%; min-width:460px}
.tbl td{border-top:1px solid var(--rule); padding:6px 10px 6px 0; vertical-align:top}
.tbl tr:first-child td{border-top:1.5px solid var(--ink); border-bottom:1px solid var(--ink); font-weight:600}
.tbl tr:last-child td{border-bottom:1.5px solid var(--ink)}
.tbl td.num{font-variant-numeric:tabular-nums; text-align:right}

/* ---------- highlights */
mark.hl{color:inherit; background:linear-gradient(transparent 10%, var(--t) 10%, var(--t) 94%, transparent 94%);
  box-shadow:inset 0 -1.5px 0 var(--c); -webkit-box-decoration-break:clone; box-decoration-break:clone; cursor:pointer; border-radius:1px}
mark.hl.st-done{box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--c) 55%,transparent); background:linear-gradient(transparent 10%, color-mix(in srgb,var(--t) 50%,transparent) 10%, color-mix(in srgb,var(--t) 50%,transparent) 94%, transparent 94%)}
mark.hl.st-dismissed{background:none; box-shadow:inset 0 -1px 0 var(--ink3)}
mark.hl.active{background:var(--t); box-shadow:0 0 0 2px var(--c)}
.show-edits mark.hl.has-sugg:not(.st-dismissed){text-decoration:line-through; text-decoration-color:var(--del); text-decoration-thickness:1.5px}
ins.sugg{display:none; text-decoration:none; color:var(--ins); background:color-mix(in srgb,var(--ins) 12%,transparent); border-bottom:1.5px solid var(--ins); padding:0 2px; margin-left:2px; border-radius:2px; cursor:pointer; user-select:none; -webkit-user-select:none}
.show-edits ins.sugg{display:inline}
.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{outline:3px solid var(--c, var(--accent)); outline-offset:3px}100%{outline:3px solid transparent; outline-offset:8px}}

/* ---------- text edits */
.sheet [data-block].edited{position:relative}
.sheet [data-block].edited::before{content:""; position:absolute; left:-20px; top:.25em; bottom:.25em; width:3px; border-radius:2px; background:var(--ins)}
.sheet figcaption.edited::before{left:-14px}
.sheet .tbl.edited::before{left:-20px; top:0; bottom:0}
.sheet.edit-mode [data-block]:not(.editing){cursor:text; border-radius:3px}
.sheet.edit-mode [data-block]:not(.editing):hover{box-shadow:0 0 0 1px var(--rule), 0 0 0 6px color-mix(in srgb,var(--accent) 6%,transparent)}
.sheet [data-block].editing{outline:2px solid var(--accent); outline-offset:6px; border-radius:3px; background:color-mix(in srgb,var(--accent) 5%,transparent); cursor:text}
.sheet [data-block].editing math{outline:1px dotted var(--ink3); border-radius:2px}
del.chg{color:var(--del); text-decoration:line-through; text-decoration-thickness:1.5px; background:color-mix(in srgb,var(--del) 9%,transparent); border-radius:2px}
ins.chg{color:var(--ins); text-decoration:none; border-bottom:1.5px solid var(--ins); background:color-mix(in srgb,var(--ins) 10%,transparent); border-radius:2px}
.sheet:not(.show-edits) del.chg{display:none}
.sheet:not(.show-edits) ins.chg{color:inherit; border-bottom:0; background:none}
.ebar{position:fixed; z-index:22; display:none; align-items:center; gap:8px; flex-wrap:wrap; left:calc((100% - var(--rail)) / 2); transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px)); max-width:min(760px, calc(100% - var(--rail) - 32px)); padding:9px 10px 9px 14px;
  background:var(--paper); border:1px solid var(--rule); border-radius:12px; box-shadow:0 10px 30px rgba(10,20,30,.18); font-size:13px}
.ebar.on{display:flex}
.ebar-title{font-weight:600}
.ebar-notes{display:flex; gap:6px; flex-wrap:wrap; align-items:center; color:var(--ink2); font-size:12.5px}
.ebar-notes label{display:inline-flex; align-items:center; gap:4px; padding:2px 7px 2px 5px; border:1px solid var(--rule); border-radius:999px; background:var(--chip); cursor:pointer; color:var(--ink)}
.ebar-notes label .dot{width:8px; height:8px; border-radius:50%; background:var(--c)}
.ebar .grow{flex:1}
.quote.edited{color:var(--ink3)}
.addressed{margin:0 0 6px; font-size:12.5px; color:var(--ins)}
.addressed button{border:0; background:none; padding:0; color:var(--accent); font-size:12.5px; text-decoration:underline; cursor:pointer}

/* ---------- figure boxes */
.boxes{position:absolute; inset:0}
.fbox{position:absolute; border:2px solid var(--c); background:color-mix(in srgb,var(--t) 55%,transparent); border-radius:3px; cursor:pointer}
.fbox.st-done{border-style:dashed; background:transparent}
.fbox.st-dismissed{border:1px dashed var(--ink3); background:transparent}
.fbox .tag{position:absolute; left:-2px; top:-20px; background:var(--c); color:#fff; font:600 11px/1 var(--font-ui); padding:4px 6px; border-radius:4px 4px 4px 0; white-space:nowrap}
.fbox.active{box-shadow:0 0 0 3px var(--paper), 0 0 0 5px var(--c)}
.fbox .grip{display:none; position:absolute; right:-6px; bottom:-6px; width:12px; height:12px; background:var(--paper); border:2px solid var(--c); border-radius:3px; cursor:nwse-resize}
.box-mode .fbox{cursor:move} .box-mode .fbox .grip{display:block}
.fbox.draft{border-style:dashed; --c:var(--c-mine); --t:var(--t-mine); pointer-events:none}

/* ---------- selection popover */
.pop{position:fixed; z-index:20; display:none; gap:2px; padding:4px; background:var(--ink); border-radius:9px; box-shadow:0 6px 20px rgba(0,0,0,.25)}
.pop.on{display:flex}
.pop button{border:0; background:transparent; color:var(--paper); padding:6px 10px; border-radius:6px; font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px}
.pop button:hover{background:rgba(255,255,255,.14)}
.pop .note-hint{color:var(--paper); opacity:.75; font-size:12px; padding:6px 8px}

/* ---------- rail */
.rail{border-left:1px solid var(--rule); background:var(--paper); display:flex; flex-direction:column; min-height:0}
.rail-head{padding:14px 16px 10px; border-bottom:1px solid var(--rule); display:flex; flex-direction:column; gap:10px}
.rail-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.rail-top h2{margin:0; font-size:15px; font-weight:600}
.rail-top .count{font-size:12px; color:var(--ink2)}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--rule); background:var(--paper); border-radius:999px; padding:3px 9px 3px 7px; font-size:12px; color:var(--ink2)}
.chip .dot{width:9px; height:9px; border-radius:50%; background:var(--c)}
.chip .n{font-variant-numeric:tabular-nums; color:var(--ink3)}
.chip[aria-pressed="true"]{border-color:var(--c); color:var(--ink); background:var(--t)}
.chip[aria-pressed="true"] .n{color:var(--ink2)}
.chips.filtering .chip[aria-pressed="false"]{opacity:.55}
.rail-tools{display:flex; gap:6px; align-items:center}
.rail-tools .seg button{padding:4px 9px; font-size:12px}
.search{flex:1; min-width:0; border:1px solid var(--rule); border-radius:8px; padding:5px 9px; background:var(--paper); font-size:13px}
.list{overflow:auto; flex:1; min-height:0; padding:4px 0 40px}
.empty{padding:28px 20px; color:var(--ink2); font-size:13px; line-height:1.55}
.empty b{color:var(--ink)}
.note{position:relative; padding:12px 16px 12px 19px; border-bottom:1px solid var(--rule2); cursor:pointer}
.note::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--c)}
.note.st-done::before,.note.st-dismissed::before{opacity:.35}
.note.st-dismissed{color:var(--ink2)}
.note:hover{background:color-mix(in srgb,var(--chip) 60%,transparent)}
.note.sel{background:var(--t)}
.note header{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink2); margin-bottom:5px}
.note header .catname{color:var(--c); font-weight:600}
.note header .num{font-variant-numeric:tabular-nums; color:var(--ink3)}
.note header .loc{margin-left:auto; color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:45%}
.quote{font-family:var(--font-doc); font-style:italic; font-size:13.5px; color:var(--ink2); margin:0 0 6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.quote.box{font-family:var(--font-ui); font-style:normal; font-size:12px}
.quote.orphan{color:var(--del)}
.comment{margin:0 0 6px; white-space:pre-wrap; overflow-wrap:anywhere}
.comment.blank{color:var(--ink3); font-style:italic}
.sugg-line{margin:0 0 6px; font-size:13px; overflow-wrap:anywhere}
.sugg-line span{color:var(--ink2)}
.sugg-line ins{text-decoration:none; color:var(--ins); border-bottom:1.5px solid var(--ins)}
.note footer{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px}
.note footer .by{margin-left:auto; font-size:11.5px; color:var(--ink3)}
.state{font-size:11.5px; font-weight:500; padding:1px 7px; border-radius:999px; background:var(--chip); color:var(--ink2)}
.state.done{color:var(--ins)}
.edit{display:flex; flex-direction:column; gap:8px; margin-top:4px; cursor:default}
.edit label{display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--ink2)}
.edit textarea,.edit select{border:1px solid var(--rule); border-radius:7px; padding:6px 8px; background:var(--paper); font-size:13.5px; line-height:1.45; resize:vertical}
.edit textarea{min-height:64px}
.edit textarea.s{min-height:38px}
.edit .row{display:flex; gap:6px}
.confirm{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--del)}
.linkbtn{border:0; background:none; padding:0; color:var(--accent); font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:2px}
.linkbtn.danger{color:var(--del)}

/* ---------- reply threads */
.thread{margin:8px 0 2px; padding-left:10px; border-left:2px solid var(--rule); display:flex; flex-direction:column; gap:7px; cursor:default}
.reply{font-size:13px}
.reply .rh{display:flex; align-items:baseline; gap:6px; font-size:11.5px; color:var(--ink3)}
.reply .who{font-weight:600; color:var(--ink2); max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.reply .ra{margin-left:auto; display:inline-flex; gap:9px}
.reply .rt{margin:1px 0 0; white-space:pre-wrap; overflow-wrap:anywhere}
.replybar{margin:6px 0 0; cursor:default}
.composer{display:flex; flex-direction:column; gap:6px; margin-top:8px; cursor:default}
.composer textarea{border:1px solid var(--rule); border-radius:7px; padding:6px 8px; background:var(--paper); font-size:13.5px; line-height:1.45; min-height:54px; resize:vertical}
.composer .row{display:flex; gap:6px; align-items:center}
.composer .hint{font-size:11.5px; color:var(--ink3); margin-left:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:9px 14px; border-radius:9px; font-size:13px; z-index:30; opacity:0; pointer-events:none; transition:opacity .2s}
.toast.on{opacity:.95}
.modal{position:fixed; inset:0; background:rgba(10,15,20,.45); display:none; align-items:center; justify-content:center; z-index:40; padding:20px}
.modal.on{display:flex}
.modal .card{background:var(--paper); border-radius:12px; width:min(720px,100%); max-height:85%; display:flex; flex-direction:column; padding:16px; gap:10px}
.modal textarea{flex:1; min-height:300px; font:12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; border:1px solid var(--rule); border-radius:8px; padding:10px; background:var(--chip)}
.modal .row{display:flex; gap:8px; justify-content:flex-end}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

.report .bar > .seg, .report #importBtn, .report #addGeneral, .report #exportHtml, .report .pop, .report .rail-tools:has(#statusSeg){display:none!important}
@media (max-width: 960px){
  .main{grid-template-columns:1fr}
  .rail{position:fixed; left:0; right:0; bottom:0; height:72%; border-left:0; border-top:1px solid var(--rule); border-radius:14px 14px 0 0; transform:translateY(105%); transition:transform .22s ease; z-index:15; box-shadow:0 -10px 30px rgba(0,0,0,.18); padding-bottom:env(safe-area-inset-bottom,0px)}
  .rail.open{transform:none}
  .notes-toggle{display:inline-flex}
  .ebar{left:8px; right:8px; transform:none; max-width:none}
  .desk{padding:14px 8px 60px}
  .sheet{padding:28px 20px 48px}
  figure{margin:1.8em -8px}
  figcaption{margin:10px 8px 0}
}
@media (max-width: 600px){
  .bar{gap:6px; padding:6px 8px}
  .btn{padding:5px 8px; font-size:12px}
  .seg button{padding:5px 8px; font-size:12px}
  .toggle{font-size:12px}
  .file span{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>
<div data-shell class="app" id="app">
  <div class="bar">
    <div class="file"><b>__DOC_NAME__</b><span id="store">Loading notes…</span></div>
    <div class="seg" role="group" aria-label="Tool">
      <button id="modeText" aria-pressed="true" title="Select text to highlight or comment (T)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 13h10M5.5 10.5l5-7 2 1.5-5 7H5.5z"/></svg>Highlight text</button>
      <button id="modeBox" aria-pressed="false" title="Drag on a figure to draw a box (B)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="11" height="9" rx="1" stroke-dasharray="2.2 1.6"/></svg>Box on figure</button>
    <button id="modeEdit" aria-pressed="false" title="Click a paragraph, caption or table to change its text (E)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.5 2.8l2.7 2.7-7.4 7.4-3.2.5.5-3.2z"/><path d="M9 4.3l2.7 2.7"/></svg>Edit text</button>
    </div>
    <button class="toggle" id="edits" aria-pressed="true" title="Show suggested wording and text edits as tracked changes"><span class="sw"></span>Show changes</button>
    <span class="spacer"></span>
    <button class="sig" id="sigBtn" aria-haspopup="dialog"><span>Signing as</span><b id="sigName">you</b></button>
    <div class="sigpop" id="sigPop" role="dialog" aria-label="Signature">
      <label for="sigInput">Sign your notes and edits as</label>
      <input id="sigInput" maxlength="40" autocomplete="off" spellcheck="false">
      <p>For this session only. Leave it empty to use your account name. Notes and edits you already made keep their signature.</p>
      <div class="row"><button class="btn" id="sigCancel">Cancel</button><button class="btn primary" id="sigSave">Save</button></div>
    </div>
    <button class="btn" id="importBtn">Import JSON</button>
    <button class="btn" id="exportJson">Export JSON</button>
    <button class="btn" id="exportMd" title="Download the notes, replies and text edits as a Markdown list">Export Markdown</button>
    <button class="btn" id="exportHtml" title="Download a standalone, read-only copy of the paper with every note, reply and edit. It opens in any browser, offline.">Export HTML</button>
    <button class="btn notes-toggle" id="notesToggle">Notes</button>
    <input type="file" id="importFile" accept=".json,application/json" class="sr" tabindex="-1">
  </div>
  <div class="main">
    <div class="desk" id="desk"><article class="sheet show-edits" id="sheet"></article></div>
    <aside class="rail" id="rail" aria-label="Notes">
      <div class="rail-head">
        <div class="rail-top"><h2>Notes</h2><span class="count" id="count"></span></div>
        <div class="chips" id="chips"></div>
        <div class="rail-tools">
          <div class="seg" role="group" aria-label="Status filter" id="statusSeg">
            <button data-st="open" aria-pressed="true">Open</button>
            <button data-st="done" aria-pressed="false">Done</button>
            <button data-st="dismissed" aria-pressed="false">Dismissed</button>
            <button data-st="all" aria-pressed="false">All</button>
          </div>
        </div>
        <div class="rail-tools">
          <input class="search" id="search" type="search" placeholder="Search notes and quoted text" aria-label="Search notes">
          <button class="btn" id="addGeneral" title="Add a note not tied to any text">Add note</button>
        </div>
      </div>
      <div class="list" id="list" role="list"></div>
    </aside>
  </div>
</div>
<div data-shell class="pop" id="pop" role="toolbar" aria-label="Annotate selection">
  <button id="popHl"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 13h10M5.5 10.5l5-7 2 1.5-5 7H5.5z"/></svg>Highlight</button>
  <button id="popCm"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>Comment</button>
</div>
<div data-shell class="pop" id="popHint"><span class="note-hint">Select text within one paragraph</span></div>
<div data-shell class="ebar" id="ebar" role="toolbar" aria-label="Edit text">
  <span class="ebar-title" id="ebarTitle">Editing</span>
  <span class="ebar-notes" id="ebarNotes"></span>
  <span class="grow"></span>
  <button class="btn small" id="ebarRevert" title="Load the original text into the editor (nothing changes until you save)">Use original</button>
  <button class="btn small" id="ebarCancel">Cancel</button>
  <button class="btn small primary" id="ebarSave" title="Save (Ctrl/Cmd+Enter)">Save edit</button>
</div>
<div data-shell class="toast" id="toast" role="status" aria-live="polite"></div>
<div data-shell class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="card">
    <b id="modalTitle">Export</b>
    <span style="font-size:13px;color:var(--ink2)" id="modalMsg">Copy the text below.</span>
    <textarea id="modalText" readonly></textarea>
    <div class="row"><button class="btn" id="modalClose">Close</button><button class="btn primary" id="modalCopy">Copy</button></div>
  </div>
</div>

<script>
const DOC = __DOC__;
const IMGS = __IMGS__;
// A standalone report carries its notes as data (window.REVIEW_SNAPSHOT) and runs read-only.
const STATIC = window.REVIEW_SNAPSHOT || null;
// The page's own parts, captured before anything renders, so "Export HTML" can write a copy of it.
const SHELL = {
  // Styles are collected from the whole document: inside the artifact viewer the page is wrapped in the
  // viewer's own document, and the browser moves this page's <style> and font links into <body>.
  head: [...document.querySelectorAll('meta[charset], meta[name="viewport"], title, style, link[href^="https://fonts."]')].map(el => el.outerHTML).join('\n'),
  body: [...document.body.children].filter(el => el.hasAttribute('data-shell')).map(el => el.outerHTML).join('\n'),
  js: document.currentScript ? document.currentScript.textContent : '',
};
const CATS = [
  {id:'blocker',  name:'Fix before sharing'},
  {id:'numbers',  name:'Numbers don\u2019t match'},
  {id:'stats',    name:'Methods and stats'},
  {id:'figures',  name:'Figures'},
  {id:'framing',  name:'Accuracy and framing'},
  {id:'refs',     name:'References'},
  {id:'typos',    name:'Typos and wording'},
  {id:'coauthor', name:'Co-author comments'},
  {id:'mine',     name:'My notes'},
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const LS_KEY = '__SLUG__-review-notes';
const COLL = 'annotations';
const EDITS = 'edits', LOCKS = 'editlocks', REPLIES = 'replies';
const LS_REPLIES = LS_KEY + ':replies', MAX_REPLY = 4000;
const MATH_NS = 'http://www.w3.org/1998/Math/MathML';
const TAB_ID = 't' + Math.random().toString(36).slice(2, 9);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const S = {
  anns: new Map(), mode: 'text', showEdits: true, cats: new Set(), status: 'open', q: '',
  selected: null, editing: null, confirmDel: null,
  store: 'loading', readOnly: false, db: null, user: null, me: null, names: {},
  sig: '', myName: '', ownerId: null,        // sig: this session's signature; ownerId: shows the notes Claude seeded unsigned
  edits: new Map(), ed: null,
  replies: new Map(), rindex: new Map(), replyingTo: null, replyDraft: '', editingReply: null, confirmDelReply: null, openThreads: new Set(),
};

/* ================= document ================= */
const order = new Map(), loc = new Map(), plain = new Map(), blockEls = new Map(), blockHTML = new Map(), origText = new Map();
function renderDoc() {
  let h = '', h2 = '', h3 = '';
  DOC.blocks.forEach((b, i) => {
    order.set(b.id, i);
    const id = esc(b.id);
    switch (b.kind) {
      case 'title': loc.set(b.id, 'Title'); h += `<h1 class="doc-title" data-block="${id}">${b.html}</h1>`; break;
      case 'h2': h2 = b.html; h3 = ''; loc.set(b.id, h2); h += `<h2 data-block="${id}">${b.html}</h2>`; break;
      case 'h3': h3 = b.html; loc.set(b.id, h3); h += `<h3 data-block="${id}">${b.html}</h3>`; break;
      case 'ref': loc.set(b.id, 'Reference ' + b.id.slice(4)); h += `<p class="ref" data-block="${id}">${b.html}</p>`; break;
      case 'figure': {
        loc.set(b.id, b.label); const im = IMGS[b.fig];
        h += `<figure id="${id}"><div class="figwrap" data-fig="${id}"><img src="${im.src}" width="${im.w}" height="${im.h}" alt="${esc(b.label)}"><div class="boxes"></div></div><figcaption data-block="${id}">${b.caption}</figcaption></figure>`;
        break;
      }
      case 'table': {
        loc.set(b.id, b.label);
        const rows = b.rows.map(r => '<tr>' + r.map(c => `<td${isNum(c) ? ' class="num"' : ''}>${c}</td>`).join('') + '</tr>').join('');
        h += `<div class="tbl" data-block="${id}"><div class="tcap">${b.caption}</div><div class="tscroll"><table>${rows}</table></div></div>`;
        break;
      }
      default: loc.set(b.id, h3 || h2 || 'Front matter'); h += `<p data-block="${id}">${b.html}</p>`;
    }
  });
  $('#sheet').innerHTML = h;
  document.querySelectorAll('[data-block]').forEach(el => {
    blockEls.set(el.dataset.block, el); blockHTML.set(el.dataset.block, el.innerHTML); plain.set(el.dataset.block, el.textContent);
    origText.set(el.dataset.block, el.textContent);
  });
}
function isNum(html) {
  const t = String(html).replace(/<annotation[\s\S]*?<\/annotation>/g, '').replace(/<[^>]+>/g, '').replace(/&[a-z#0-9]+;/gi, ' ').trim();
  return !!t && /\p{Nd}/u.test(t) && !/\p{L}{2,}/u.test(t);
}

/* ================= text anchoring ================= */
function textNodes(root) {
  const out = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement && n.parentElement.closest('.sugg, del.chg') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  let n; while ((n = w.nextNode())) out.push(n);
  return out;
}
function nthIndex(text, exact, occ) {
  let i = -1, from = 0;
  for (let k = 0; k <= occ; k++) { i = text.indexOf(exact, from); if (i < 0) return -1; from = i + exact.length; }
  return i;
}
function occBefore(text, exact, start) {
  let n = 0, from = 0, i;
  while ((i = text.indexOf(exact, from)) >= 0 && i < start) { n++; from = i + exact.length; }
  return n;
}
function wrapRange(root, s, e, a) {
  const marks = []; let pos = 0;
  for (const n of textNodes(root)) {
    const ns = pos, ne = pos + n.data.length; pos = ne;
    if (ne <= s || ns >= e) continue;
    if (n.parentElement && n.parentElement.closest('math')) continue; // never inject marks into MathML
    const a0 = Math.max(s, ns) - ns, a1 = Math.min(e, ne) - ns;
    let t = n;
    if (a0 > 0) t = t.splitText(a0);
    if (a1 - a0 < t.data.length) t.splitText(a1 - a0);
    const m = document.createElement('mark');
    m.className = `hl cat-${a.cat} st-${a.status}` + (a.suggestion ? ' has-sugg' : '') + (S.selected === a.id ? ' active' : '');
    m.dataset.id = a.id;
    t.parentNode.insertBefore(m, t); m.appendChild(t); marks.push(m);
  }
  return marks;
}
function posOf(root, container, offset) {
  const r = document.createRange(); r.setStart(root, 0); r.setEnd(container, offset);
  let n = 0;
  for (const t of textNodes(root)) {
    if (t === container) { n += offset; break; }
    if (r.intersectsNode(t)) n += t.data.length; else if (n > 0) break;
  }
  return n;
}
function anchorPos(a) { // start offset in the untouched block text, -1 if the text no longer matches
  if (a.kind !== 'text') return 0;
  const t = plain.get(a.block); if (t == null) return -1;
  return nthIndex(t, a.exact, a.occ || 0);
}

/* ================= filtering / ordering ================= */
function matches(a) {
  if (S.cats.size && !S.cats.has(a.cat)) return false;
  if (S.status !== 'all' && a.status !== S.status) return false;
  if (S.q) {
    const q = S.q.toLowerCase();
    const rs = (S.rindex.get(a.id) || []).map(r => r.text + ' ' + authorName(r));
    const hay = [a.comment, a.suggestion, a.exact, loc.get(a.block), CAT[a.cat]?.name, authorName(a), ...rs].join(' ').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}
function sortKey(a) {
  if (a.kind === 'note') return [-1, a.seq || 0, 0];
  const bi = order.has(a.block) ? order.get(a.block) : 1e6;
  if (a.kind === 'box') return [bi, -1, (a.y || 0) * 1000 + (a.x || 0)];
  return [bi, 0, anchorPos(a)];
}
function cmp(x, y) { const a = sortKey(x), b = sortKey(y); for (let i = 0; i < 3; i++) if (a[i] !== b[i]) return a[i] - b[i]; return (x.seq || 0) - (y.seq || 0); }
function allSorted() { return [...S.anns.values()].sort(cmp); }

/* ================= rendering ================= */
let touched = new Set(), numbers = new Map();
function render() { numbers = new Map(allSorted().map((a, i) => [a.id, i + 1])); renderMarks(); renderBoxes(); renderRail(); }
function renderMarks() {
  const by = new Map();
  for (const a of S.anns.values()) {
    if (a.kind !== 'text' || !matches(a) || !blockEls.has(a.block)) continue;
    if (!by.has(a.block)) by.set(a.block, []);
    by.get(a.block).push(a);
  }
  const todo = new Set([...touched, ...by.keys(), ...S.edits.keys()]);
  for (const id of todo) {
    const el = blockEls.get(id); if (!el) continue;
    if (S.ed && S.ed.block === id) continue;
    el.innerHTML = displayHTML(id);
    el.classList.toggle('edited', S.edits.has(id));
    for (const a of (by.get(id) || [])) {
      const text = textNodes(el).map(n => n.data).join('');
      const s = nthIndex(text, a.exact, a.occ || 0);
      if (s < 0) continue;
      const marks = wrapRange(el, s, s + a.exact.length, a);
      if (a.suggestion && marks.length) {
        const ins = document.createElement('ins');
        ins.className = 'sugg'; ins.dataset.id = a.id; ins.textContent = a.suggestion;
        const last = marks[marks.length - 1]; last.after(ins);
      }
    }
  }
  touched = new Set([...by.keys(), ...S.edits.keys()]);
}
function renderBoxes() {
  document.querySelectorAll('.figwrap .boxes').forEach(b => b.innerHTML = '');
  for (const a of S.anns.values()) {
    if (a.kind !== 'box' || !matches(a)) continue;
    const wrap = document.querySelector(`.figwrap[data-fig="${CSS.escape(a.block)}"] .boxes`); if (!wrap) continue;
    const d = document.createElement('div');
    d.className = `fbox cat-${a.cat} st-${a.status}` + (S.selected === a.id ? ' active' : '');
    d.dataset.id = a.id;
    Object.assign(d.style, { left: a.x * 100 + '%', top: a.y * 100 + '%', width: a.w * 100 + '%', height: a.h * 100 + '%' });
    d.innerHTML = `<span class="tag">#${numbers.get(a.id) || ''}</span><span class="grip" data-grip="1"></span>`;
    d.setAttribute('aria-label', `Box note ${numbers.get(a.id) || ''}`);
    wrap.appendChild(d);
  }
}
function renderChips() {
  const counts = {}; for (const c of CATS) counts[c.id] = 0;
  for (const a of S.anns.values()) if (S.status === 'all' || a.status === S.status) counts[a.cat] = (counts[a.cat] || 0) + 1;
  const chips = $('#chips');
  chips.classList.toggle('filtering', S.cats.size > 0);
  chips.innerHTML = CATS.filter(c => counts[c.id] || S.cats.has(c.id) || (c.id === 'mine' && !S.readOnly)).map(c =>
    `<button class="chip cat-${c.id}" data-cat="${c.id}" aria-pressed="${S.cats.has(c.id)}"><span class="dot"></span>${esc(c.name)}<span class="n">${counts[c.id] || 0}</span></button>`).join('');
}
// A note shows its signature when it has one, else the account name of whoever wrote it (resolved
// from their id at render time; names are never stored). Notes Claude seeded without a signature
// (byOwner) show the page owner's account name.
function authorKey(a) { return a.author ? '' : a.authorId || (a.byOwner ? S.ownerId || '' : ''); }
function authorName(a) {
  if (a.author) return a.author;
  const id = authorKey(a);
  if (id) return (S.names[id] || '') || (S.me && id === S.me ? 'You' : a.byOwner ? 'Page owner' : 'Someone');
  return a.byOwner ? 'Page owner' : 'You';
}
function renderRail() {
  const all = allSorted();
  renderChips();
  const list = all.filter(matches);
  const open = all.filter(a => a.status === 'open').length;
  $('#count').textContent = S.store === 'static' ? `${list.length} of ${all.length} notes` : `${list.length} shown, ${open} open of ${all.length}`;
  $('#notesToggle').textContent = `Notes (${open})`;
  const el = $('#list');
  const focus = document.activeElement && el.contains(document.activeElement) ? { id: document.activeElement.dataset.field, s: document.activeElement.selectionStart, e: document.activeElement.selectionEnd } : null;
  if (!all.length) {
    el.innerHTML = S.store === 'local'
      ? `<div class="empty"><b>No notes yet.</b><br>Notes are kept in this browser only because shared storage isn\u2019t available here. Import <b>annotations.json</b> to load the review notes, or select text to add your own.</div>`
      : S.store === 'loading' ? `<div class="empty">Loading notes…</div>`
      : `<div class="empty"><b>No notes yet.</b><br>Select text in the manuscript to highlight or comment, switch to <b>Box on figure</b> to mark part of a figure, or import a JSON export.</div>`;
    return;
  }
  if (!list.length) { el.innerHTML = `<div class="empty">No notes match these filters.</div>`; return; }
  el.innerHTML = list.map(noteHTML).join('');
  if (focus && focus.id) {
    const f = el.querySelector(`[data-field="${focus.id}"]`);
    if (f) { f.focus(); try { f.setSelectionRange(focus.s, focus.e); } catch (_) {} }
  }
  resolveNames(list);
}
function noteHTML(a) {
  const n = numbers.get(a.id), c = CAT[a.cat] || CAT.mine;
  let quote = '';
  if (a.kind === 'text') {
    const ok = anchorPos(a) >= 0;
    quote = ok ? `<p class="quote">\u201C${esc(a.exact)}\u201D</p>`
      : S.edits.has(a.block) ? `<p class="quote edited">Changed by an edit: \u201C${esc(a.exact)}\u201D</p>`
      : `<p class="quote orphan">Quoted text not found: \u201C${esc(a.exact)}\u201D</p>`;
  } else if (a.kind === 'box') quote = `<p class="quote box">Box on ${esc(loc.get(a.block) || 'figure')}</p>`;
  const where = a.kind === 'note' ? 'General' : (loc.get(a.block) || '');
  const head = `<header><span class="catname">${esc(c.name)}</span><span class="num">#${n}</span><span class="loc">${esc(where)}</span></header>`;
  if (S.editing && S.editing.id === a.id) {
    const d = S.editing.draft;
    return `<article class="note cat-${d.cat} st-${a.status} sel" data-id="${a.id}" role="listitem">${head}${quote}
      <div class="edit">
        <label>Category<select data-field="cat">${CATS.map(x => `<option value="${x.id}" ${x.id === d.cat ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>
        <label>Comment<textarea data-field="comment" placeholder="What should change, and why?">${esc(d.comment)}</textarea></label>
        ${a.kind === 'text' ? `<label>Suggested replacement for the quoted text (optional)<textarea class="s" data-field="suggestion" placeholder="Leave empty for a comment only">${esc(d.suggestion)}</textarea></label>` : ''}
        <div class="row"><button class="btn primary small" data-act="save">Save note</button><button class="btn small" data-act="cancel">Cancel</button></div>
      </div></article>`;
  }
  const comment = a.comment ? `<p class="comment">${esc(a.comment)}</p>` : a.suggestion ? '' : `<p class="comment blank">No comment</p>`;
  const sugg = a.suggestion ? `<p class="sugg-line"><span>Suggested: </span><ins>${esc(a.suggestion)}</ins></p>` : '';
  const addr = a.addressedBy ? `<p class="addressed">Addressed by an edit (${esc(editAuthor(a.addressedBy))}) \u00b7 <button data-act="showedit">Show</button></p>` : '';
  const thread = threadHTML(a);
  const canEdit = !S.readOnly && (a.kind === 'text' || a.kind === 'box') && blockEls.has(a.block);
  let foot;
  if (S.confirmDel === a.id) {

/* ================= persistence ================= */

/* ----- replies: one document per reply in their own collection, so two people replying at

  for (const xs of m.values()) xs.sort((x, y) => String(x.createdAt || '').localeCompare(String(y.createdAt || '')) || String(x.id).localeCompare(String(y.id)));

}

let lsRTimer;
function saveLocalReplies() { clearTimeout(lsRTimer); lsRTimer = setTimeout(() => { try { localStorage.setItem(LS_REPLIES, JSON.stringify([...S.replies.values()])); } catch (_) {} }, 250); }

let lsTimer;
function saveLocal() { clearTimeout(lsTimer); lsTimer = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify([...S.anns.values()].map(strip))); } catch (_) {} }, 250); }

/* ----- signature: each person may sign as they like for this session; otherwise their account name */
const SIG_KEY = LS_KEY + ':sig';
function loadSig() { try { return (sessionStorage.getItem(SIG_KEY) || '').trim(); } catch (_) { return ''; } }

async function init() {
  S.sig = loadSig(); renderSig();
  renderDoc(); render();
  if (STATIC) {
    document.body.classList.add('report');
    S.readOnly = true; S.status = 'all'; syncStatusSeg(); renderSig();
    for (const a of STATIC.notes || []) S.anns.set(a.id, a);
    for (const e of STATIC.edits || []) S.edits.set(e.block, e);
    for (const c of STATIC.replies || []) S.replies.set(c.id, c);
    reindexReplies(); refreshEdits();
    S.store = 'static';
    $('#store').textContent = `Review snapshot: ${(STATIC.notes || []).length} notes, ${STATIC.date || ''}`;
    render(); return;
  }
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (_) { db = null; }
  if (!db) {
    setStore('local');
    for (const a of loadLocal()) S.anns.set(a.id, a);
    for (const e of loadLocalEdits()) if (e && e.block) S.edits.set(e.block, e);
    for (const r of loadLocalReplies()) if (r && r.id && r.note) S.replies.set(r.id, r);
    reindexReplies(); refreshEdits(); render(); return;
  }
  S.db = db; setStore('db');
  db.collection(REPLIES).onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => { const v = d.data(); if (v && v.note) m.set(d.id, { ...v, id: d.id }); });
    if (S.editingReply && !m.has(S.editingReply.id)) S.editingReply = null;
    S.replies = m; reindexReplies(); renderRail();
  }, () => {});
  db.collection(EDITS).onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => { const v = d.data(); if (v && v.block) m.set(v.block, { ...v }); });
    if (S.ed && m.get(S.ed.block)?.updatedAt !== S.edits.get(S.ed.block)?.updatedAt) S.ed.remoteChanged = true;
    S.edits = m; refreshEdits(); render();
  }, () => {});
  db.collection(COLL).onSnapshot(snap => {
    const m = new Map();
    snap.docs.forEach(d => { const v = d.data(); if (v) m.set(d.id, { ...v, id: d.id }); });
    if (S.editing && !m.has(S.editing.id)) S.editing = null;
    S.anns = m; render();
  }, e => { if (e && e.code === 'revoked') { setStore('local'); render(); } else toast('Live updates paused. Reload to reconnect.'); });
  try {
    const user = window.claude.use ? await window.claude.use('user') : null;
    if (user) {
      S.user = user;
      const me = await user.me();
      S.me = me.id; S.myName = me.name || '';
      const can = await user.can('data.write');
      if (can === false) setReadOnly(true);
      renderSig();
      // Notes Claude seeded without a signature belong to whoever asked for the review, the page's
      // owner: record the owner's id once (only the owner writes it) so everyone sees their name.
      try {
        const od = db.doc('meta/owner'), snap = await od.get();
        S.ownerId = snap.exists ? (snap.data().id || null) : null;
        if (me.isOwner && S.me && S.ownerId !== S.me && can !== false) { await od.set({ id: S.me }); S.ownerId = S.me; }
      } catch (_) {}
      renderRail();
    }
  } catch (_) {}
}

/* ================= actions ================= */

}

}

      const fl = t ? (t.closest('.figwrap') ? t : t) : target;

}
function setStatus(id, st) { const a = { ...S.anns.get(id) }; a.status = st; if (st === 'open') delete a.addressedBy; persist(a); toast(st === 'done' ? 'Marked done' : st === 'dismissed' ? 'Dismissed' : 'Reopened'); }

/* ----- selection popover */
let pending = null;
function hidePop() { $('#pop').classList.remove('on'); $('#popHint').classList.remove('on'); pending = null; }
function placePop(el, rect) {
  el.classList.add('on');
  const w = el.offsetWidth, h = el.offsetHeight;
  let x = rect.left + rect.width / 2 - w / 2, y = rect.top - h - 8;
  if (y < 8) y = rect.bottom + 8;
  x = Math.max(8, Math.min(innerWidth - w - 8, x));
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function onSelection() {
  if (S.mode !== 'text' || S.readOnly) return hidePop();
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return hidePop();
  const r = sel.getRangeAt(0);
  const sheet = $('#sheet');
  if (!sheet.contains(r.commonAncestorContainer)) return hidePop();
  const bStart = (r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement).closest('[data-block]');
  const bEnd = (r.endContainer.nodeType === 1 ? r.endContainer : r.endContainer.parentElement).closest('[data-block]');
  const rect = r.getBoundingClientRect();
  if (!bStart || bStart !== bEnd) { pending = null; $('#pop').classList.remove('on'); placePop($('#popHint'), rect); return; }
  $('#popHint').classList.remove('on');
  const text = textNodes(bStart).map(n => n.data).join('');
  let s = posOf(bStart, r.startContainer, r.startOffset), e = posOf(bStart, r.endContainer, r.endOffset);
  while (s < e && /\s/.test(text[s])) s++;
  while (e > s && /\s/.test(text[e - 1])) e--;
  if (e <= s) return hidePop();
  const exact = text.slice(s, e);
  pending = { block: bStart.dataset.block, exact, occ: occBefore(text, exact, s) };
  placePop($('#pop'), rect);
}
function createFromSelection(withComment) {
  if (!pending) return;
  const a = baseNote({ kind: 'text', block: pending.block, exact: pending.exact, occ: pending.occ });
  getSelection().removeAllRanges(); hidePop();
  persist(a);
  if (withComment) startEdit(a.id); else { select(a.id); toast('Highlighted. Add a comment from the Notes list any time.'); }
}

/* ----- boxes */
let drag = null;
function frac(wrap, ev) {
  const r = wrap.getBoundingClientRect();
  return { x: Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)), y: Math.max(0, Math.min(1, (ev.clientY - r.top) / r.height)) };
}
function onPointerDown(ev) {
  const wrap = ev.target.closest('.figwrap'); if (!wrap) return;
  const box = ev.target.closest('.fbox');
  if (S.mode !== 'box') { if (box) { select(box.dataset.id); openRailMobile(); } return; }
  if (S.readOnly) return;
  ev.preventDefault();
  const p = frac(wrap, ev);
  if (box) {
    const a = S.anns.get(box.dataset.id); if (!a) return;
    drag = { type: ev.target.dataset.grip ? 'resize' : 'move', wrap, el: box, a: { ...a }, p0: p };
    select(a.id);
  } else {
    const el = document.createElement('div'); el.className = 'fbox draft';
    wrap.querySelector('.boxes').appendChild(el);
    drag = { type: 'new', wrap, el, p0: p, fig: wrap.dataset.fig };
  }
  wrap.setPointerCapture(ev.pointerId);
}
function onPointerMove(ev) {
  if (!drag) return;
  const p = frac(drag.wrap, ev), d = drag;
  if (d.type === 'new') {
    d.r = { x: Math.min(p.x, d.p0.x), y: Math.min(p.y, d.p0.y), w: Math.abs(p.x - d.p0.x), h: Math.abs(p.y - d.p0.y) };
  } else if (d.type === 'move') {
    const a = d.a;
    d.r = { x: Math.max(0, Math.min(1 - a.w, a.x + p.x - d.p0.x)), y: Math.max(0, Math.min(1 - a.h, a.y + p.y - d.p0.y)), w: a.w, h: a.h };
  } else {
    const a = d.a;
    d.r = { x: a.x, y: a.y, w: Math.max(0.01, Math.min(1 - a.x, a.w + p.x - d.p0.x)), h: Math.max(0.01, Math.min(1 - a.y, a.h + p.y - d.p0.y)) };
  }
  Object.assign(d.el.style, { left: d.r.x * 100 + '%', top: d.r.y * 100 + '%', width: d.r.w * 100 + '%', height: d.r.h * 100 + '%' });
}
function onPointerUp() {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.type === 'new') {
    d.el.remove();
    if (!d.r || d.r.w < 0.012 || d.r.h < 0.012) return;
    const a = baseNote({ kind: 'box', block: d.fig, x: +d.r.x.toFixed(4), y: +d.r.y.toFixed(4), w: +d.r.w.toFixed(4), h: +d.r.h.toFixed(4) });
    persist(a); startEdit(a.id);
  } else if (d.r) {
    const a = { ...S.anns.get(d.a.id), x: +d.r.x.toFixed(4), y: +d.r.y.toFixed(4), w: +d.r.w.toFixed(4), h: +d.r.h.toFixed(4) };
    persist(a); select(a.id);
  }
}

/* ----- export / import */
function exportPayload() {
  const edits = [...S.edits.values()].sort((x, y) => (order.get(x.block) ?? 1e6) - (order.get(y.block) ?? 1e6))
    .map(e => { const { history, ...rest } = e; return { ...rest, location: loc.get(e.block) || e.block, ...(e.author ? {} : { authorName: editAuthor(e) }) }; });

  const annotations = allSorted().map(a => a.author ? strip(a) : { ...strip(a), authorName: authorName(a) });
  const replies = [...S.replies.values()].filter(r => S.anns.has(r.note))
    .sort((x, y) => (numbers.get(x.note) || 0) - (numbers.get(y.note) || 0) || String(x.createdAt || '').localeCompare(String(y.createdAt || '')))
    .map(r => r.author ? { ...r } : { ...r, authorName: authorName(r) });

      const st = a.status === 'open' ? '' : a.status === 'done' ? ' [done]' : ' [dismissed]';
      md += `- **#${numbers.get(a.id)} ${where}**${st}`;
      if (a.kind === 'text') md += ` \u201C${a.exact}\u201D`;
      if (a.kind === 'box') md += ` (box on figure)`;
      md += `\n  ${(a.comment || '(no comment)').replace(/\n/g, '\n  ')}`;
      if (a.suggestion) md += `\n  Suggested: ${a.suggestion}`;
      md += `\n  (${authorName(a)})\n`;

        const d = r.createdAt ? new Date(r.createdAt) : null;

    md += `\n## Text edits (${eds.length})\n\nDeleted text is ~~struck through~~; added text is **bold**.\n\n`;
    for (const e of eds) {
      const nums = (e.addresses || []).map(id => numbers.get(id)).filter(Boolean).map(n => '#' + n);

/* Group changes that are separated only by whitespace into one replacement, so a rewritten

    else h += '';
    if (g.ins.length) h += g.ins.some(x => !/^ \u0001/.test(x.k)) ? `<ins class="chg">${g.ins.map(x => x.h).join('')}</ins>` : g.ins.map(x => x.h).join('');

function diffBlockHTML(origHTML, newHTML) {
  const A = document.createElement('div'), B = document.createElement('div'); A.innerHTML = origHTML; B.innerHTML = newHTML;
  const segs = el => [...el.querySelectorAll('.tcap, td, th')];
  const sa = segs(A), sb = segs(B);
  if (sa.length || sb.length) {
    if (sa.length !== sb.length) return newHTML;
    sa.forEach((x, i) => { if (x.innerHTML !== sb[i].innerHTML) sb[i].innerHTML = opsHTML(diffOps(atomize(x), atomize(sb[i]))); });

function textDiffMd(before, after) {
  const tok = t => (t.match(/\s+|[^\s]+/g) || []).map(x => ({ k: /^\s+$/.test(x) ? ' \u0001' : x + '\u0001', h: x }));
  const parts = [];
  for (const g of groupOps(diffOps(tok(before), tok(after)))) {
    if (g.eq) { if (parts.length && parts[parts.length - 1].eq != null) parts[parts.length - 1].eq += g.eq.h; else parts.push({ eq: g.eq.h }); continue; }

    if (!first && !last && w.length > 2 * W) return w.slice(0, W).join(' ') + ' \u2026 ' + w.slice(-W).join(' ');

/* ----- persistence for edits */
const LS_EDITS = LS_KEY + ':edits';
let lsETimer;
function saveLocalEdits() { clearTimeout(lsETimer); lsETimer = setTimeout(() => { try { localStorage.setItem(LS_EDITS, JSON.stringify([...S.edits.values()])); } catch (_) {} }, 250); }
function loadLocalEdits() { try { const v = JSON.parse(localStorage.getItem(LS_EDITS) || '[]'); return Array.isArray(v) ? v : []; } catch (_) { return []; } }
function writeEdit(block, html, addresses) {
  const now = new Date().toISOString(), prev = S.edits.get(block);
  if (html === origClean(block)) {               // back to the original: drop the edit
    S.edits.delete(block);
    if (S.store === 'db') queue('e:' + block, () => S.db.collection(EDITS).doc(block).delete()); else saveLocalEdits();
    return null;
  }
  const doc = {
    block, html, text: textOfHTML(html), baseText: origText.get(block) || '',
    ...authorFields(), createdAt: prev?.createdAt || now, updatedAt: now,
    addresses: [...new Set([...(prev?.addresses || []), ...addresses])],
    history: prev ? [...(prev.history || []), { html: prev.html, authorId: prev.authorId || null, author: prev.author || '', at: prev.updatedAt }].slice(-10) : [],
  };
  while (doc.history.length && JSON.stringify(doc).length > 200000) doc.history.shift();   // documents are capped at 256 KiB
  if (JSON.stringify(doc).length > 250000) { toast('This block is too large to save as one edit.'); return null; }
  S.edits.set(block, doc);
  if (S.store === 'db') queue('e:' + block, () => S.db.collection(EDITS).doc(block).set(doc)); else saveLocalEdits();
  return doc;
}
function markAddressed(ids, block) {
  const now = new Date().toISOString();
  for (const id of ids) {
    const a = S.anns.get(id); if (!a || a.status !== 'open') continue;
    persist({ ...a, status: 'done', addressedBy: { block, at: now, ...authorFields() } });
  }
}

/* ----- one block at a time, guarded by a short cooperative lease so two people don't edit it at once */
async function takeLock(block) {
  if (S.store !== 'db') return true;
  try {
    const r = await S.db.collection(LOCKS).doc(block).acquire({ holder: S.me || TAB_ID, ttlMs: 45000 });
    return !!r.acquired;
  } catch (_) { return true; }
}
function dirty() { return S.ed && sanitize(S.ed.el.innerHTML) !== S.ed.startHTML; }
function finishOrKeep() {
  if (!S.ed) return true;
  if (dirty()) { toast('Save or cancel the text you’re editing first.'); S.ed.el.focus(); return false; }
  endBlockEdit(); return true;
}
async function startBlockEdit(block, opts = {}) {
  if (S.readOnly) { toast('You can view this manuscript but not change it.'); return; }
  const el = blockEls.get(block); if (!el) return;
  if (S.ed) { if (S.ed.block === block) return; if (!finishOrKeep()) return; }
  if (S.mode !== 'edit') setMode('edit', true);
  if (!(await takeLock(block))) { toast('Someone else is editing this part right now. Try again in a minute.'); return; }
  const start = curHTML(block);
  el.innerHTML = start;
  el.classList.add('editing'); el.classList.remove('edited');
  el.querySelectorAll('math').forEach(m => m.setAttribute('contenteditable', 'false'));
  el.setAttribute('contenteditable', 'true'); el.spellcheck = true;
  S.ed = { block, el, startHTML: sanitize(start), addresses: new Set(opts.addresses || []), timer: null };
  if (S.store === 'db') S.ed.timer = setInterval(() => takeLock(block), 30000);
  renderEditBar();
  el.focus({ preventScroll: true });
  const sel = getSelection(); sel.removeAllRanges();
  let r = null;
  if (opts.note && opts.note.kind === 'text') r = rangeForText(el, opts.note.exact, opts.note.occ || 0);
  if (!r && opts.point && document.caretRangeFromPoint) r = document.caretRangeFromPoint(opts.point.x, opts.point.y);
  if (!r) { r = document.createRange(); r.selectNodeContents(el); r.collapse(false); }
  sel.addRange(r);
  if (opts.note) el.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' });
  closeRailMobile();
}
function rangeForText(root, exact, occ) {
  const nodes = textNodes(root), text = nodes.map(n => n.data).join('');
  const s = nthIndex(text, exact, occ); if (s < 0) return null;
  const e = s + exact.length, r = document.createRange();
  let pos = 0, started = false;
  for (const n of nodes) {             // start inside the node that holds the first character, never at the end of the previous one
    const ns = pos, ne = pos + n.data.length; pos = ne;
    if (!started && s < ne) { r.setStart(n, s - ns); started = true; }
    if (started && e <= ne) { r.setEnd(n, e - ns); return r; }
  }

}
function renderEditBar() {
  if (!S.ed) { $('#ebar').classList.remove('on'); return; }
  const b = S.ed.block;
  const cands = allSorted().filter(a => a.block === b && (a.status === 'open' || S.ed.addresses.has(a.id)));
  $('#ebarTitle').textContent = 'Editing ' + (loc.get(b) || 'text');
  $('#ebarNotes').innerHTML = cands.length ? 'Addresses: ' + cands.map(a => `<label class="cat-${a.cat}" title="${esc((a.comment || a.exact || '').slice(0, 140))}"><input type="checkbox" data-addr="${esc(a.id)}" ${S.ed.addresses.has(a.id) ? 'checked' : ''}><span class="dot"></span>#${numbers.get(a.id) || ''}</label>`).join('') : '';
  $('#ebarRevert').style.display = S.edits.has(b) ? '' : 'none';
  $('#ebar').classList.add('on');
}
function endBlockEdit() {
  const ed = S.ed; if (!ed) return;
  clearInterval(ed.timer);
  ed.el.removeAttribute('contenteditable'); ed.el.classList.remove('editing');
  S.ed = null; touched.add(ed.block); $('#ebar').classList.remove('on');
  render();
}
function saveBlockEdit() {
  const ed = S.ed; if (!ed) return;
  const html = sanitize(ed.el.innerHTML);
  const changed = html !== ed.startHTML;
  if (changed) writeEdit(ed.block, html, [...ed.addresses]);
  if (ed.addresses.size) markAddressed([...ed.addresses], ed.block);
  refreshEdits(); endBlockEdit();
  toast(changed ? (ed.addresses.size ? `Edit saved; ${ed.addresses.size} note${ed.addresses.size === 1 ? '' : 's'} marked addressed` : 'Edit saved') : ed.addresses.size ? 'Marked addressed' : 'No changes');
}
function cancelBlockEdit() { if (!S.ed) return; endBlockEdit(); toast('Edit cancelled'); }
function applySuggestion(id) {
  const a = S.anns.get(id); if (!a || S.readOnly) return;
  if (S.ed && !finishOrKeep()) return;
  const tmp = document.createElement('div'); tmp.innerHTML = curHTML(a.block);
  const r = rangeForText(tmp, a.exact, a.occ || 0);
  if (!r) { toast('That text has already changed. Edit it by hand.'); startBlockEdit(a.block, { addresses: [id], note: a }); return; }
  const anc = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  if (anc && anc.closest('tr, tbody, thead, table') && !anc.closest('td, th')) { toast('That text spans table cells. Edit it by hand.'); startBlockEdit(a.block, { addresses: [id], note: a }); return; }
  r.deleteContents(); r.insertNode(document.createTextNode(a.suggestion));
  tmp.normalize();

  markAddressed([id], a.block);
  refreshEdits(); render(); toast('Suggestion applied');

$('#ebarSave').onclick = () => saveBlockEdit();
$('#ebarCancel').onclick = () => cancelBlockEdit();
$('#ebarRevert').onclick = () => { if (!S.ed) return; S.ed.el.innerHTML = blockHTML.get(S.ed.block); S.ed.el.querySelectorAll('math').forEach(m => m.setAttribute('contenteditable', 'false')); S.ed.el.focus(); toast('Original text loaded. Save to keep it.'); };
$('#ebar').addEventListener('mousedown', e => { if (!e.target.closest('input,label')) e.preventDefault(); });
$('#ebarNotes').addEventListener('change', e => { const id = e.target.dataset.addr; if (!id || !S.ed) return; e.target.checked ? S.ed.addresses.add(id) : S.ed.addresses.delete(id); });
$('#sheet').addEventListener('paste', e => {
  if (!S.ed || !S.ed.el.contains(e.target)) return;
  e.preventDefault();
  const t = (e.clipboardData && e.clipboardData.getData('text/plain') || '').replace(/\s+/g, ' ');
  document.execCommand('insertText', false, t);
});
$('#sheet').addEventListener('drop', e => { if (S.ed && S.ed.el.contains(e.target)) e.preventDefault(); });

init();
</script>
